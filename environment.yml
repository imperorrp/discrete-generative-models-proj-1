name: dgm
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  - tqdm
  - scikit-learn
  - jupyterlab
  - nbconvert
  - pip
  - pip:
    # PyTorch is installed by pip so the CUDA build matches the GPU. RTX 50-series
    # (Blackwell, sm_120) needs the cu128 wheels, PyTorch >= 2.7:
    #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
    - torchmetrics          # FID
    - torch-fidelity        # FID backend
    - transformers          # frozen CLIP text encoder
    - datasets              # CIFAR-100 from the HuggingFace CDN
    - pot                   # Wasserstein for the cell-state metrics
